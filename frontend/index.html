<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Siswa</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container">

        <h1>Data Siswa</h1>

        <!-- FORM SISWA -->
        <div class="card">

            <h2 id="formTitle">Tambah Siswa</h2>

            <form id="siswaForm">

                <input type="hidden" id="siswaId">

                <div class="form-group">
                    <label>NIS</label>
                    <input
                        type="text"
                        id="nis"
                        placeholder="Masukkan NIS"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Nama</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Kelas</label>
                    <input
                        type="text"
                        id="kelas"
                        placeholder="Contoh: XI RPL 1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Jurusan</label>
                    <input
                        type="text"
                        id="jurusan"
                        placeholder="Contoh: Rekayasa Perangkat Lunak"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Alamat</label>
                    <textarea
                        id="alamat"
                        placeholder="Masukkan alamat"
                        required
                    ></textarea>
                </div>

                <button type="submit" id="submitButton">
                    Tambah Siswa
                </button>

                <button
                    type="button"
                    id="cancelButton"
                    class="cancel"
                    onclick="cancelEdit()"
                    style="display: none;"
                >
                    Batal
                </button>

            </form>

        </div>


        <!-- PESAN -->
        <div id="message"></div>


        <!-- DAFTAR SISWA -->
        <div class="card">

            <div class="header-list">

                <h2>Daftar Siswa</h2>

                <button onclick="getSiswa()">
                    Refresh
                </button>

            </div>

            <div id="loading">
                Mengambil data siswa...
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>No</th>
                            <th>NIS</th>
                            <th>Nama</th>
                            <th>Kelas</th>
                            <th>Jurusan</th>
                            <th>Alamat</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="siswaTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="./js/script.js"></script>

</body>

</html>
